<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Quiz Organización corporal — Morfología General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--parchment:#f5ecd6;--amber:#c89b3c;--amber-deep:#a97e28;--ink:#1c1815;--ink-soft:#4a4239;
    --teal:#2a7a6e;--blue:#2d5d8f;--rust:#a0522d;--line:#d9c9a3;--card:#fffaf0;
    --amber-bg:#fdf3d8;--red-bg:#fbe7e3;--shadow:0 2px 4px rgba(28,24,21,.06),0 8px 24px rgba(28,24,21,.08)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:"Source Serif 4",Georgia,serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  header{background:linear-gradient(160deg,#efe3c4,#f5ecd6);border-bottom:3px solid var(--amber);padding:22px 0}
  .kicker{font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber-deep);margin:0 0 6px}
  h1{font-family:"Playfair Display",serif;font-weight:900;font-size:1.6rem;margin:0}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink)}
  input{min-width:280px}
  button{cursor:pointer;font-family:"DM Mono",monospace;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
  .btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn-ghost{background:#fff}
  .stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:"Playfair Display",serif;font-weight:900;font-size:1.9rem;line-height:1}
  .stat .l{font-size:.78rem;color:var(--ink-soft);font-family:"DM Mono",monospace;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .stat.alert .n{color:var(--rust)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:.86rem}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#efe3c4;font-family:"DM Mono",monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);position:sticky;top:0;cursor:pointer}
  tr:hover td{background:#fbf5e6}
  .tbl-wrap{overflow-x:auto;margin:14px 0}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-family:"DM Mono",monospace;font-size:.72rem}
  .amber{background:var(--amber-bg);color:var(--amber-deep)}
  .red{background:var(--red-bg);color:var(--rust);font-weight:600}
  .green{background:#e6f5f0;color:var(--teal)}
  .muted{color:var(--ink-soft);font-size:.82rem}
  .tabs{display:flex;gap:6px;margin-top:14px}
  .tabs button{border-radius:999px}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .status{font-family:"DM Mono",monospace;font-size:.76rem;color:var(--ink-soft)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:5px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="kicker">Morfología General · 2026-II · Panel docente</p>
    <h1>Dashboard · Quiz Organización corporal</h1>
    <div class="controls">
      <input id="token" type="password" placeholder="Token del instrumento">
      <input id="endpoint" placeholder="URL /exec del Apps Script" style="min-width:340px">
      <button class="btn-primary" id="btn-load">Cargar</button>
      <label class="muted"><input type="checkbox" id="auto" checked style="min-width:auto"> auto-refresh 15s</label>
      <button class="btn-ghost" id="btn-csv">Exportar CSV</button>
      <span class="status" id="status"></span>
    </div>
    <div class="tabs">
      <button id="tab-resp" class="active">Respuestas</button>
      <button id="tab-asis">Asistencia</button>
      <button id="tab-log">Eventos / antifraude</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tbl-wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <p class="muted" id="empty" style="display:none">Sin datos todavía. Verifica token y endpoint.</p>
</main>

<script>
var state={rows:[],view:"resp",sortKey:null,sortDir:1,timer:null};
var $=function(s){return document.querySelector(s)};

function saveCfg(){ try{
  sessionStorage.setItem("DASH_ORGCORP_token",$("#token").value);
  sessionStorage.setItem("DASH_ORGCORP_endpoint",$("#endpoint").value);
}catch(e){} }
(function loadCfg(){ try{
  var DEFAULT_ENDPOINT="https://script.google.com/macros/s/AKfycbwI9SiJIwScuhYtnpczk2V-js_WGAE97Xtm--nmK3waDqoZES-FQi320HsyK5Ir62_C/exec";
  $("#token").value=sessionStorage.getItem("DASH_ORGCORP_token")||"QUIZ_ORGCORP_MORF_2026II_8dd5f3";
  $("#endpoint").value=sessionStorage.getItem("DASH_ORGCORP_endpoint")||DEFAULT_ENDPOINT;
}catch(e){} })();

$("#btn-load").addEventListener("click",function(){ saveCfg(); load(); });
$("#tab-resp").addEventListener("click",function(){ setView("resp"); });
$("#tab-asis").addEventListener("click",function(){ setView("asis"); });
$("#tab-log").addEventListener("click",function(){ setView("log"); });
$("#auto").addEventListener("change",scheduleAuto);
$("#btn-csv").addEventListener("click",exportCSV);

function setView(v){
  state.view=v;
  $("#tab-resp").classList.toggle("active",v==="resp");
  $("#tab-asis").classList.toggle("active",v==="asis");
  $("#tab-log").classList.toggle("active",v==="log");
  load();
}
function scheduleAuto(){
  clearInterval(state.timer);
  if($("#auto").checked){ state.timer=setInterval(load,15000); }
}

function load(){
  var token=$("#token").value.trim(), ep=$("#endpoint").value.trim();
  if(!token||!ep){ $("#status").textContent="Falta token o endpoint"; return; }
  var action=state.view==="log"?"&action=eventos":(state.view==="asis"?"&action=asistencia":"");
  var url=ep+"?token="+encodeURIComponent(token)+action;
  $("#status").innerHTML='<span class="dot"></span>cargando…';
  fetch(url).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){ $("#status").textContent="Error: "+(d.error||"desconocido"); return; }
    state.rows=d.rows||[];
    render();
    var now=new Date();
    $("#status").innerHTML='<span class="dot"></span>OK · '+now.toLocaleTimeString();
    scheduleAuto();
  }).catch(function(e){ $("#status").textContent="Fallo de red"; });
}

function render(){
  var rows=state.rows;
  $("#empty").style.display=rows.length?"none":"block";
  if(state.sortKey){
    rows=rows.slice().sort(function(a,b){
      var x=a[state.sortKey],y=b[state.sortKey];
      return (x<y?-1:x>y?1:0)*state.sortDir;
    });
  }
  var head=rows.length?Object.keys(rows[0]):[];
  $("#table thead").innerHTML="<tr>"+head.map(function(h){return "<th data-k='"+h+"'>"+h+"</th>"}).join("")+"</tr>";
  $("#table tbody").innerHTML=rows.map(function(r){
    return "<tr>"+head.map(function(h){ return "<td>"+cell(h,r[h])+"</td>"; }).join("")+"</tr>";
  }).join("");
  document.querySelectorAll("#table th").forEach(function(th){
    th.onclick=function(){ var k=th.dataset.k; state.sortDir=(state.sortKey===k?-state.sortDir:1); state.sortKey=k; render(); };
  });
  renderStats();
}

function cell(h,v){
  if(v===undefined||v===null) return "";
  if(h==="Discrepancia" && (v==1||v==="1")) return '<span class="badge red">discrepancia</span>';
  if((h==="Paste") && Number(v)>0) return '<span class="badge red">'+v+'</span>';
  if((h==="TabSwitch") && Number(v)>15) return '<span class="badge red">'+v+'</span>';
  if((h==="TabSwitch") && Number(v)>5)  return '<span class="badge amber">'+v+'</span>';
  if((h==="Copy"||h==="Cut") && Number(v)>0) return '<span class="badge amber">'+v+'</span>';
  if(h==="Tipo" && String(v).indexOf("reinicio")>-1) return '<span class="badge red">'+v+'</span>';
  if(h==="Tipo" && (String(v).indexOf("paste")>-1||String(v).indexOf("discrepancia")>-1)) return '<span class="badge red">'+v+'</span>';
  if(h==="Puntaje"){ return '<b>'+v+'</b>'; }
  if(h==="Timestamp"||h==="Inicio"){ try{return new Date(v).toLocaleString();}catch(e){return v;} }
  return String(v);
}

function renderStats(){
  var s=$("#stats");
  if(state.view==="asis"){
    var r=state.rows, n=r.length;
    var g1=r.filter(function(x){return x.Grupo==="G1"}).length;
    var g2=r.filter(function(x){return x.Grupo==="G2"}).length;
    s.innerHTML=stat(n,"Asistencias")+stat(g1,"G1")+stat(g2,"G2");
    return;
  }
  if(state.view!=="resp"){
    var n=state.rows.length;
    var rein=state.rows.filter(function(r){return String(r.Tipo||"").indexOf("reinicio")>-1}).length;
    var pas=state.rows.filter(function(r){return String(r.Tipo||"").indexOf("paste")>-1}).length;
    var dis=state.rows.filter(function(r){return String(r.Tipo||"").indexOf("discrepancia")>-1}).length;
    s.innerHTML=stat(n,"Eventos")+stat(rein,"Reinicios",rein>0)+stat(pas,"Pegados",pas>0)+stat(dis,"Discrepancias",dis>0);
    return;
  }
  var r=state.rows, n=r.length;
  if(!n){ s.innerHTML=""; return; }
  var punt=r.map(function(x){return Number(x.Puntaje)||0});
  var prom=(punt.reduce(function(a,b){return a+b},0)/n).toFixed(1);
  var max=r.length?Number(r[0].Maximo)||12:12;
  var dis=r.filter(function(x){return x.Discrepancia==1}).length;
  var tab=r.filter(function(x){return Number(x.TabSwitch)>5}).length;
  var pas=r.filter(function(x){return Number(x.Paste)>0}).length;
  s.innerHTML=stat(n,"Envíos")+stat(prom+" / "+max,"Promedio")+
    stat(dis,"Discrepancias",dis>0)+stat(tab,"Tab > 5",tab>0)+stat(pas,"Pegados",pas>0);
}
function stat(n,l,alert){ return '<div class="stat'+(alert?' alert':'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

function exportCSV(){
  var rows=state.rows; if(!rows.length){ alert("No hay datos para exportar"); return; }
  var head=Object.keys(rows[0]);
  var csv=[head.join(",")].concat(rows.map(function(r){
    return head.map(function(h){ var v=r[h]===undefined?"":String(r[h]); return '"'+v.replace(/"/g,'""')+'"'; }).join(",");
  })).join("\r\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(state.view==="resp"?"respuestas":state.view==="asis"?"asistencia":"eventos")+"_orgcorp_2026II.csv";
  a.click();
}
</script>
</body>
</html>
